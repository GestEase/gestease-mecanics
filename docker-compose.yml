services:
  mecanics:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mecanics-devopsweb
    restart: unless-stopped
    networks:
      - devopsweb-network
    labels:
      # Portal discovery
      - "devopsweb.portal=true"
      - "devopsweb.portal.name=Mecanics"
      - "devopsweb.portal.description=Conception mecanique — Tap Drill Size Charts (Imperial, Metric, Pipe, Special)"
      - "devopsweb.portal.category=tool"
      - "devopsweb.portal.sector=tools"
      - "devopsweb.portal.subdomain=mecanics"
      - "devopsweb.portal.tech=React 19 + Vite + NGINX"

      # Traefik routing
      - "traefik.enable=true"
      - "traefik.http.routers.mecanics.rule=Host(`mecanics.devopsweb.dev`)"
      - "traefik.http.routers.mecanics.entrypoints=web"
      - "traefik.http.routers.mecanics.middlewares=keycloak-auth"
      - "traefik.http.services.mecanics.loadbalancer.server.port=80"

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"

networks:
  devopsweb-network:
    external: true
