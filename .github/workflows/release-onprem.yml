name: Release On-Premise

# Voir documentation : gestease-backlog-fix/sessions/2026-04/CHORE-OPS-028-session.md
#
# Trigger : tag onprem-v*.*.*
# Output : registry.gestflow.ca/gestease-onprem/gestease-mecanics:{version,onprem-latest}
#
# Secrets requis : HARBOR_PUSH_USER + HARBOR_PUSH_TOKEN

on:
  push:
    tags:
      - 'onprem-v*.*.*'

permissions:
  contents: read

env:
  REGISTRY: registry.gestflow.ca
  IMAGE_NAME: gestease-onprem/gestease-mecanics

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract version tag
        id: ver
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_PUSH_USER }}
          password: ${{ secrets.HARBOR_PUSH_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:onprem-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan image (Trivy)
        run: trivy image --format table --exit-code 1 --severity CRITICAL --ignore-unfixed ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}

      - name: Summary
        run: |
          {
            echo "## Image on-prem publiée"
            echo ""
            echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}\`"
            echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:onprem-latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
